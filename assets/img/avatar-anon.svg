<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Avatar anonim">
  <!-- Avatar anonim: siluet netral, tanpa ciri wajah -->
  <defs>
    <linearGradient id="avBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a30"/>
      <stop offset="1" stop-color="#141417"/>
    </linearGradient>
    <linearGradient id="avBody" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#d8d8dd"/>
      <stop offset="1" stop-color="#a9a9b2"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#avBg)"/>

  <!-- lingkaran halus di belakang -->
  <circle cx="300" cy="250" r="190" fill="#ffffff" opacity="0.035"/>

  <!-- bahu / badan -->
  <path d="M300 372c112 0 203 79 216 186 2 14-9 26-23 26H107c-14 0-25-12-23-26 13-107 104-186 216-186z" fill="url(#avBody)"/>

  <!-- kepala (tanpa wajah) -->
  <circle cx="300" cy="248" r="112" fill="url(#avBody)"/>

  <!-- leher: menutup celah antara kepala & badan -->
  <rect x="264" y="330" width="72" height="70" rx="30" fill="url(#avBody)"/>
</svg>
